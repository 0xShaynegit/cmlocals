name: Update chatbot content index

on:
  push:
    branches: [master]
    paths:
      - "**/*.html"
      - "chatbot/build-chunks.js"
      - "chatbot/upload-vectors.js"
      - "chatbot/prune-stale-vectors.js"
      - ".github/workflows/update-chatbot-index.yml"

jobs:
  reindex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build content chunks
        run: node chatbot/build-chunks.js

      - name: Embed chunks and write vectors.ndjson
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node chatbot/upload-vectors.js

      - name: Upsert vectors into Vectorize
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler vectorize upsert cmlocals-content --file=chatbot/vectors.ndjson

      - name: Prune vectors for removed/renamed pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node chatbot/prune-stale-vectors.js
